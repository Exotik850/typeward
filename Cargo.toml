[package]
name = "typeward"
version = "0.2.5"
edition = "2024"
license = "MIT"
description = "A type-driven parser combinator library for Rust."
repository = "https://github.com/Exotik850/typeward"
keywords = ["parser", "combinator", "type-driven", "rust"]

[dependencies]
array-util = { version = "1.0", optional = true }
pastey = "0.2"
stable-pattern = { version = "0.1", default-features = false }
typeward-macros = { path = "crates/typeward-macros", optional = true, version = "0.1.0"}

[features]
default = ["arrays", "macros"]
arrays = ["dep:array-util"]
macros = ["typeward-macros"]

[[example]]
name = "json"
path = "examples/json.rs"

[workspace]
members = ["crates/typeward-macros"]
